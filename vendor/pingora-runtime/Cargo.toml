[package]
edition = "2021"
name = "pingora-runtime"
version = "0.9.1"
authors = ["Yuchen Wu <yuchen@cloudflare.com>"]
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = """
Multithreaded Tokio runtime with the option of disabling work stealing.
"""
readme = false
keywords = [
    "async",
    "non-blocking",
    "pingora",
]
categories = [
    "asynchronous",
    "network-programming",
]
