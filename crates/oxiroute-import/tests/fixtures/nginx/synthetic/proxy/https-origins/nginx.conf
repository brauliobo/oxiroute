events {}
http {
  access_log off;
  proxy_buffering off;
  upstream named { server 198.51.100.22:8443; }
  server {
    listen 192.0.2.10:80 default_server;
    server_name example.com;
    location /ip/ { proxy_pass https://198.51.100.20:8443; }
    location /dns/ { proxy_pass https://origin.example.com; }
    location /named/ { proxy_pass https://named; }
    location /scheme/ { proxy_pass $scheme://198.51.100.21; }
    location / { return 404; }
  }
}
