[profile.default]
retries = 0
fail-fast = false
status-level = "fail"
final-status-level = "slow"
failure-output = "immediate-final"
slow-timeout = { period = "30s", terminate-after = 6 }

[[profile.default.overrides]]
filter = "binary_id(=oxiroute::lane_differential) | binary_id(=oxiroute::reverse_http3_golden) | binary_id(=oxiroute::supervised)"
priority = 100

[test-groups]
idle-connection-herd = { max-threads = 1 }
io-uring-rings = { max-threads = 6 }

[[profile.default.overrides]]
filter = "binary_id(=oxiroute::epoll_safety) & test(~more_idle_connections_than_a_thread_cap)"
test-group = "idle-connection-herd"

[[profile.default.overrides]]
filter = "binary_id(=oxiroute-uring::memlock) & test(~a_kernel_that_accounts_ring_memory)"
threads-required = "num-test-threads"

[profile.io_uring]
inherits = "default"

[[profile.io_uring.overrides]]
filter = "all() - (binary_id(=oxiroute::epoll_safety) & test(~more_idle_connections_than_a_thread_cap))"
test-group = "io-uring-rings"
