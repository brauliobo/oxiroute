events {}
http {
  access_log off;
  proxy_buffering off;
  upstream app { server unix:/run/oxiroute/app.sock; }
  server {
    listen 192.0.2.10:80 default_server;
    server_name example.com;
    location /plain/ { proxy_pass http://app; proxy_cookie_path / "/; SameSite=none; Secure"; }
    location /flags/ { proxy_pass http://app; proxy_cookie_flags session samesite=lax secure; }
    location / { return 404; }
  }
}
