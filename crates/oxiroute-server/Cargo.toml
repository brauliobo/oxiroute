[package]
name = "oxiroute"
description = "Pingora-based HTTP and TCP proxy runtime for OxiRoute"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[lib]
name = "oxiroute_server"

[[bin]]
name = "oxiroute"
path = "src/main.rs"

[dependencies]
arc-swap.workspace = true
async-trait.workspace = true
base64.workspace = true
bcrypt.workspace = true
bytes.workspace = true
clap.workspace = true
env_logger.workspace = true
futures-util.workspace = true
h2.workspace = true
h3.workspace = true
h3-quinn.workspace = true
http.workspace = true
httpdate.workspace = true
http-body-util.workspace = true
hyper.workspace = true
hyper-util.workspace = true
hickory-resolver.workspace = true
log.workspace = true
local-ip-address.workspace = true
notify.workspace = true
openssl.workspace = true
oxiroute-acme = { path = "../oxiroute-acme" }
oxiroute-config = { path = "../oxiroute-config" }
oxiroute-config-source = { path = "../oxiroute-config-source" }
oxiroute-cache = { path = "../oxiroute-cache" }
oxiroute-import = { path = "../oxiroute-import" }
oxiroute-forward-proxy = { path = "../oxiroute-forward-proxy" }
oxiroute-rtmp = { path = "../oxiroute-rtmp" }
pingora.workspace = true
quinn.workspace = true
rustix.workspace = true
rustls.workspace = true
rustls-native-certs.workspace = true
serde.workspace = true
serde_json.workspace = true
signal-hook.workspace = true
thiserror.workspace = true
time.workspace = true
tokio.workspace = true
tokio-openssl.workspace = true
x509-parser.workspace = true
zeroize.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
oxiroute-supervision = { path = "../oxiroute-supervision" }
oxiroute-supervision-unix = { path = "../oxiroute-supervision-unix" }
oxiroute-supervisor-master = { path = "../oxiroute-supervisor-master" }
oxiroute-supervisor-process = { path = "../oxiroute-supervisor-process" }

[dev-dependencies]
rml_rtmp.workspace = true
rustls.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "net", "rt", "sync", "time"] }
tokio-rustls.workspace = true
tokio-tungstenite.workspace = true

[[test]]
name = "tls"
path = "src/tls/tests.rs"

[[bin]]
name = "oxiroute-supervisor-launcher-fixture"
path = "tests/fixtures/supervisor_launcher.rs"
test = false
bench = false

[lints]
workspace = true
