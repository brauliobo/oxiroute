server { 
  server_name llama.olery.com;

  location / { 
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Host $host;
    proxy_pass http://10.0.4.155:80;
    proxy_buffering off;
  }   


    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/llama.olery.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/llama.olery.com/privkey.pem; # managed by Certbot
    include letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}

server {
    if ($host = llama.olery.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

 
  server_name llama.olery.com;
    listen 80;
    return 404; # managed by Certbot


}

server {
  listen 80;
  server_name olery-dump-hjkf341.brauliobo.org;

  # Basic Authentication
  auth_basic "Restricted Access";
  auth_basic_user_file /home/braulio/Projects/olery/htpasswd;

  location / {
    # Serve the specific file
    alias /home/braulio/Projects/olery/;
    try_files olery.sql.gz =404;  # Only serve olery.sql.gz, return 404 otherwise

    # Disable directory listing (important for security)
    autoindex off;

    # Optional:  Set Content-Type header (adjust as needed)
    # This helps browsers understand the file type correctly
    types {
      application/gzip gz;  # Add .gz to the types mapping
    }
    default_type application/octet-stream;  # Default for unknown types

    # Optional: Add a Content-Disposition header to suggest download
    add_header Content-Disposition "attachment; filename=olery.sql.gz";

    # Optional:  Disable caching for this specific file (if needed)
    expires off;
    etag off;  # Helps prevent caching problems if the file is updated
    add_header 'Cache-Control' 'no-store, no-cache, must-revalidate, proxy-revalidate';
  }
}

