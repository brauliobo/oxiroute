global
    maxconn     20000
    log         127.0.0.1 local0
    user        haproxy
    chroot      /usr/share/haproxy
    #pidfile     /run/haproxy.pid
    daemon

defaults
    log     global
    mode    http
    option  httplog
    option  dontlognull
    retries 3
    timeout connect 600s
    timeout client  600s
    timeout server  600s
    timeout http-request    600s
    timeout http-keep-alive 60s
    option  redispatch

frontend stats
    mode http
    bind *:8404
    stats enable
    stats uri /stats
    stats refresh 10s
    stats admin if LOCALHOST
    #stats admin if LOCALHOST

frontend  main
    bind unix@/var/run/haproxy.sock mode 777
    mode                 http
    log                  global
    option               httplog
    option               dontlognull
    option forwardfor    except 127.0.0.0/8
    maxconn              8000

    acl is_ollama hdr(host) -i ollama.yellowmaverick.com
    use_backend app_ollama if is_ollama

    #acl url_static path_beg -i /static /images /javascript /stylesheets
    #acl url_static path_end -i .jpg .gif .png .css .js
    #use_backend static if url_static

    #default_backend app

backend app_ollama
    mode http
    balance leastconn
    option httpchk GET /
    http-check expect status 200
    retries 3
    option  redispatch

    server wb  whitebeast.lan:11434  check inter 10s fall 3 rise 2
    server wb2 whitebeast.lan:11435  check inter 10s fall 3 rise 2
    server bh  bhavapower.lan:11434  check inter 10s fall 3 rise 2
    server bh2 bhavapower.lan:11435  check inter 10s fall 3 rise 2
    server ph  phoenix.lan:11434     check inter 10s fall 3 rise 2
    server cp  chicopc.lan:11434     check inter 10s fall 3 rise 2
    server cp2 chicopc.lan:11435     check inter 10s fall 3 rise 2
    server bk1 back1.lan:11434       check inter 10s fall 3 rise 2
    server bk2 back1.lan:11435       check inter 10s fall 3 rise 2
    server mm  macmini.lan:11434     check inter 10s fall 3 rise 2

