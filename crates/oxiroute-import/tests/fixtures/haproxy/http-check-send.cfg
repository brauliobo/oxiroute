defaults web
  mode http
  option httpchk
  timeout connect 5s
  timeout client 30s
  timeout server 30s
  default-server check inter 1s rise 1 fall 2
frontend public
  bind 127.0.0.1:18080
  default_backend app
backend app
  balance roundrobin
  http-check send meth GET uri /healthz ver HTTP/1.1 hdr Host backend.internal
  http-check expect status 204
  server app1 127.0.0.1:3000
