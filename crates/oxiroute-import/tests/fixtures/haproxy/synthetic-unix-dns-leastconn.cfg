defaults synthetic_defaults
  mode tcp
  retries 0
  timeout connect 5s
  timeout client 50s
  timeout server 50s

frontend hostrouter
  bind /run/haproxy/hostrouter.sock maxconn 1500
  maxconn 2000
  default_backend app_nodes

backend app_nodes
  balance leastconn
  server app01 unresolvable-app01.invalid:3000
  server app02 unresolvable-app02.invalid:3000
