[package]
name = "oxiroute-fuzz"
version = "0.0.0"
publish = false
edition = "2024"
rust-version = "1.97"

[package.metadata]
cargo-fuzz = true

[dependencies]
bytes = "1"
libfuzzer-sys = "0.4"
oxiroute-config = { path = "../crates/oxiroute-config" }
oxiroute-config-source = { path = "../crates/oxiroute-config-source" }
oxiroute-forward-proxy = { path = "../crates/oxiroute-forward-proxy" }
oxiroute-import = { path = "../crates/oxiroute-import" }
oxiroute-rtmp = { path = "../crates/oxiroute-rtmp", features = ["fuzzing"] }
oxiroute-server = { package = "oxiroute", path = "../crates/oxiroute-server" }
pingora-core = { path = "../vendor/pingora-core", default-features = false }
rml_rtmp = { path = "../vendor/rml_rtmp" }
rustls = { version = "0.23.40", default-features = false, features = ["ring", "std", "tls12"] }
tokio = { version = "1", features = ["io-util", "rt"] }
tokio-test = "0.4"

[workspace]

[patch.crates-io]
pingora-core = { path = "../vendor/pingora-core" }
pingora-load-balancing = { path = "../vendor/pingora-load-balancing" }
pingora-proxy = { path = "../vendor/pingora-proxy" }
pingora-rustls = { path = "../vendor/pingora-rustls" }
rml_rtmp = { path = "../vendor/rml_rtmp" }

[[bin]]
name = "config_source"
path = "fuzz_targets/config_source.rs"
test = false
doc = false
bench = false

[[bin]]
name = "native_source"
path = "fuzz_targets/native_source.rs"
test = false
doc = false
bench = false

[[bin]]
name = "forward_target"
path = "fuzz_targets/forward_target.rs"
test = false
doc = false
bench = false

[[bin]]
name = "overread_io"
path = "fuzz_targets/overread_io.rs"
test = false
doc = false
bench = false

[[bin]]
name = "rtmp_handshake"
path = "fuzz_targets/rtmp_handshake.rs"
test = false
doc = false
bench = false

[[bin]]
name = "rtmp_chunk"
path = "fuzz_targets/rtmp_chunk.rs"
test = false
doc = false
bench = false

[[bin]]
name = "rtmp_amf"
path = "fuzz_targets/rtmp_amf.rs"
test = false
doc = false
bench = false

[[bin]]
name = "rtmp_media_config"
path = "fuzz_targets/rtmp_media_config.rs"
test = false
