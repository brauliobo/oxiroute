[graph]
all-features = true

[advisories]
version = 2
# Keep every RustSec advisory fail-closed. The current Pingora dependency chain is documented in
# docs/developer/SECURITY_AUDIT.md and is intentionally not an exception here.
unmaintained = "all"
ignore = []

[bans]
multiple-versions = "warn"
wildcards = "warn"
highlight = "all"

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
  "0BSD",
  "Apache-2.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = ["https://github.com/hyperium/h3"]
