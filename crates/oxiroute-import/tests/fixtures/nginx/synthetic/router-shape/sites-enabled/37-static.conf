server {
  listen 80;
  listen [::]:80;
  server_name static.example.net;
  location ^~ /.well-known/acme-challenge/ {
    root /var/www/letsencrypt;
    default_type text/plain;
    try_files $uri =404;
  }
  location / { return 301 https://$host$request_uri; }
}
server {
  listen 443 ssl;
  listen [::]:443 ssl;
  server_name static.example.net;
  ssl_certificate @LIVE@/static.example.net/fullchain.pem;
  ssl_certificate_key @LIVE@/static.example.net/privkey.pem;
  include snippets/ssl-options.conf;
  root /var/www/static;
  location / { index index.html; }
}
