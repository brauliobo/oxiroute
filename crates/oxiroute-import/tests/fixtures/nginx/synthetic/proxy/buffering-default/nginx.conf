events {}
http {
  access_log off;
  upstream app { server unix:/run/oxiroute/app.sock; }
  server {
    listen 192.0.2.10:80 default_server;
    server_name example.com;
    location /buffered/ { proxy_pass http://app; }
    location /explicit/ { proxy_pass http://app; proxy_buffering on; }
    location /streamed/ { proxy_pass http://app; proxy_buffering off; }
    location / { return 404; }
  }
}
