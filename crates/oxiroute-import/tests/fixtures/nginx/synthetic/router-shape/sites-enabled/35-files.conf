server {
  if ($host = files.example.net) {
    return 301 https://$host$request_uri;
  }
  listen 80;
  listen [::]:80;
  server_name files.example.net;
  return 404;
}
server {
  listen 443 ssl;
  listen [::]:443 ssl;
  server_name files.example.net;
  ssl_certificate @LIVE@/files.example.net/fullchain.pem;
  ssl_certificate_key @LIVE@/files.example.net/privkey.pem;
  include snippets/ssl-options.conf;
  location / {
    proxy_pass http://app_main;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    client_max_body_size 16400M;
    proxy_request_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }
}
