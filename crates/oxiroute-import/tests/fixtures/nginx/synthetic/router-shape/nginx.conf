user www-data;
worker_processes auto;
pid /run/nginx.pid;
error_log /var/log/nginx/error.log warn;

events {
  worker_connections 1024;
}

http {
  include mime.types;
  default_type application/octet-stream;

  log_format custom '$remote_addr - $remote_user [$time_local] "$request" $status $body_bytes_sent "$http_referer" "$http_user_agent" "$host"';
  access_log /var/log/nginx/access.log custom;
  error_log off;

  sendfile on;
  send_timeout 600;
  types_hash_max_size 2048;
  large_client_header_buffers 4 32k;
  limit_req_zone $binary_remote_addr zone=burst:10m rate=10r/s;
  keepalive_timeout 65;
  client_max_body_size 100m;

  gzip on;
  gzip_comp_level 9;
  gzip_types text/plain text/css application/json application/javascript;

  proxy_http_version 1.1;

  upstream app_main { server unix:/run/oxiroute/app.sock; }
  upstream git_main { server unix:/run/oxiroute/git.sock; }
  upstream media_main { server unix:/run/oxiroute/media.sock; }

  include sites-enabled/*.conf;
}
