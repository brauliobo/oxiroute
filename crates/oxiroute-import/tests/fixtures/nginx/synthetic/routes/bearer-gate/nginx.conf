events {}
http {
  access_log off;
  proxy_buffering off;
  upstream app { server unix:/run/oxiroute/app.sock; }
  server {
    listen 192.0.2.10:80 default_server;
    server_name api.example.com;
    location / {
      if ($http_authorization != "Bearer test-token-0000") {
        return 401;
      }
      proxy_pass http://app;
    }
  }
}
