server {
  if ($host = api.example.net) {
    return 301 https://$host$request_uri;
  }
  listen 80;
  listen [::]:80;
  server_name api.example.net;
  return 404;
}
server {
  listen 443 ssl;
  listen [::]:443 ssl;
  server_name api.example.net;
  ssl_certificate @LIVE@/api.example.net/fullchain.pem;
  ssl_certificate_key @LIVE@/api.example.net/privkey.pem;
  include snippets/ssl-options.conf;
  location / {
    if ($http_authorization != "Bearer test-token-0000") {
      return 401;
    }
    proxy_pass http://app_main;
    proxy_set_header Host $host;
    proxy_buffering off;
  }
}
