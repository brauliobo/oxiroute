defaults web
  mode http
  retries 0
  timeout connect 5s
  timeout server 30s
frontend public
  bind 127.0.0.1:18080
  acl api_host hdr(host) -i api.example.test
  acl api_path path_beg /v1
  use_backend api if api_host api_path
  default_backend fallback
backend api
  balance roundrobin
  server api1 127.0.0.1:3000
backend fallback
  balance roundrobin
  server fallback1 127.0.0.1:3001
