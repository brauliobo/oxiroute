# Sanitized shape of the active hostrouter.lan /etc/squid/squid.conf observed with Squid 7.6.
# Host-specific values are synthetic; standard Squid keywords and built-in ACL names are retained.
# Authentication helper and realm values are synthetic replacements.
http_port 31280
access_log none
dns_nameservers 192.0.2.20 192.0.2.21
acl acl_0 src 192.0.2.13/32
acl acl_0 src 192.0.2.14/32
acl acl_1 port 31000
acl acl_2 port 31000
acl acl_2 port 31000
acl acl_2 port 31000
acl acl_2 port 31000
acl acl_2 port 31000
acl acl_2 port 1024-65535
acl acl_2 port 31000
acl acl_2 port 31000
acl acl_2 port 31000
acl acl_2 port 31000
http_access deny !acl_2
http_access deny CONNECT !acl_1
http_access allow localhost manager
http_access deny manager
http_access allow localhost
http_access deny to_localhost
http_access deny to_linklocal
auth_param basic program /usr/lib/squid/basic_ncsa_auth /tmp/squid-synthetic-users
auth_param basic realm Synthetic proxy realm for sanitized host fixture
auth_param basic credentialsttl 2 hours
acl acl_8 proxy_auth REQUIRED
http_access allow acl_8
http_access deny all
coredump_dir /tmp/squid-synthetic-state
forwarded_for delete
via off
refresh_pattern ^ftp: 60 20% 60
refresh_pattern -i (/cgi-bin/|\?) 60 20% 60
refresh_pattern . 60 20% 60
