global
    maxconn 256
    log stdout format raw local0
    user haproxy
    group haproxy
    chroot /usr/share/haproxy

defaults
    mode http
    log global
    option httplog
    timeout connect 5s
    timeout client 30m
    timeout server 30m
    timeout queue 30m

frontend omnivoice
    bind 127.0.0.1:10440
    default_backend omnivoice_nodes

frontend hymt2
    bind 127.0.0.1:12002
    default_backend hymt2_nodes

frontend whispercpp
    bind 127.0.0.1:8080
    timeout client 2h
    default_backend whispercpp_nodes

frontend omnivoice_node
    bind 10.0.0.10:10440
    acl infrastructure_health path -i /_infra/health
    http-request return status 200 content-type text/plain string ok if infrastructure_health
    default_backend omnivoice_workers

frontend hymt2_node
    bind 10.0.0.10:12002
    acl infrastructure_health path -i /_infra/health
    http-request return status 200 content-type text/plain string ok if infrastructure_health
    default_backend hymt2_workers

frontend whispercpp_node
    bind 10.0.0.10:8080
    timeout client 2h
    acl infrastructure_health path -i /_infra/health
    http-request return status 200 content-type text/plain string ok if infrastructure_health
    default_backend whispercpp_workers

listen stats
    bind 10.0.0.10:8404
    bind [fd00::10]:8404
    mode http
    stats enable
    stats hide-version
    stats uri /stats
    stats refresh 5s
    stats show-legends
    stats show-node
    http-request use-service prometheus-exporter if { path /metrics }

backend omnivoice_nodes
    balance first
    option httpchk GET /_infra/health
    option http-server-close
    http-check expect status 200
    default-server check inter 10s fastinter 3s downinter 1m fall 3 rise 2

    server whitebeast 10.0.0.10:10440 maxconn 2
    server phoenix 10.0.0.11:10440 maxconn 1
    # RTX 3060 observed at 73 C under sustained TTS load; monitor thermals.
    server back1 10.0.0.7:10440 maxconn 2
    server bhava 10.0.0.14:10440 maxconn 2
    server chicopc 10.0.0.15:10440 maxconn 2

backend hymt2_nodes
    balance first
    option httpchk GET /_infra/health
    option http-server-close
    http-check expect status 200
    default-server check inter 10s fastinter 3s downinter 1m fall 3 rise 2

    server whitebeast 10.0.0.10:12002 maxconn 2
    server phoenix 10.0.0.11:12002 maxconn 1
    server back1 10.0.0.7:12002 maxconn 2
    server bhava 10.0.0.14:12002 maxconn 2
    server chicopc 10.0.0.15:12002 maxconn 2

backend whispercpp_nodes
    balance first
    option httpchk GET /_infra/health
    option http-server-close
    timeout server 2h
    timeout queue 10m
    http-check expect status 200
    default-server check inter 10s fastinter 3s downinter 1m fall 3 rise 2

    server whitebeast 10.0.0.10:8080 maxconn 2
    server phoenix 10.0.0.11:8080 maxconn 1
    server back1 10.0.0.7:8080 maxconn 2
    server bhava 10.0.0.14:8080 maxconn 2
    server chicopc 10.0.0.15:8080 maxconn 2

backend omnivoice_workers
    balance first
    option http-server-close
    server gpu1 127.0.0.1:10451 maxconn 1 no-check
    server gpu0 127.0.0.1:10450 maxconn 1 no-check

backend hymt2_workers
    balance first
    option http-server-close
    server gpu1 127.0.0.1:12011 maxconn 1 no-check
    server gpu0 127.0.0.1:12010 maxconn 1 no-check

backend whispercpp_workers
    balance first
    option http-server-close
    timeout server 2h
    server gpu1 127.0.0.1:8181 maxconn 1 no-check
    server gpu0 127.0.0.1:8180 maxconn 1 no-check
