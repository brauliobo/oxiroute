# Synthetic nginx-RTMP: one supported ingest server and one server blocked by an unsupported pull.
rtmp {
  server {
    listen 127.0.0.1:1935;
    application live {
      live on;
    }
  }

  server {
    listen 127.0.0.1:1936;
    application relay {
      live on;
      pull rtmp://origin.example.net/live;
    }
  }
}
