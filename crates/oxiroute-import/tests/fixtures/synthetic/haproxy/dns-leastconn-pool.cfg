# Synthetic HTTP service backed by a DNS-named least-connection pool with a queue timeout.
global
  maxconn 2048
  user haproxy
  group haproxy
  daemon
  chroot /var/lib/haproxy

defaults web
  mode http
  retries 3
  option redispatch
  timeout connect 5s
  timeout client 30s
  timeout server 10m
  timeout queue 10m

frontend public
  bind 192.0.2.10:8080
  default_backend media_nodes

backend media_nodes
  balance leastconn
  default-server check inter 3s rise 2 fall 3
  server media01 media01.example.net:4000
  server media02 media02.example.net:4000
  server media03 media03.example.net:4000
