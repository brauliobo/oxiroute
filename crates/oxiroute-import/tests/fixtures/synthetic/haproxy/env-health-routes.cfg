# Synthetic multi-service node: ${NODE_IP} binds, an optional second server, and fixed health routes.
global
  maxconn 1024

defaults web
  mode http
  retries 3
  option redispatch
  timeout connect 5s
  timeout client 30s
  timeout server 30m
  timeout queue 30m

frontend alpha
  bind ${NODE_IP}:11434
  acl health path -i /_infra/health
  http-request return status 200 content-type text/plain string ok if health
  default_backend alpha_nodes
backend alpha_nodes
  balance roundrobin
  server alpha1 127.0.0.1:3000
.if defined(GPU1)
  server alpha2 127.0.0.1:3001
.else
  server alpha2 127.0.0.1:3002
.endif

frontend beta
  bind ${NODE_IP}:11435
  acl health path -i /_infra/health
  http-request return status 200 content-type text/plain string ok if health
  default_backend beta_nodes
backend beta_nodes
  balance roundrobin
  server beta1 127.0.0.1:3100
  server beta2 127.0.0.1:3101

frontend gamma
  bind ${NODE_IP}:11436
  acl health path -i /_infra/health
  http-request return status 200 content-type text/plain string ok if health
  default_backend gamma_nodes
backend gamma_nodes
  balance roundrobin
  server gamma1 127.0.0.1:3200
  server gamma2 127.0.0.1:3201
