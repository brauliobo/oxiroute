server {
  listen 443 ssl;
  listen [::]:443 ssl;
  server_name origin.example.net;
  ssl_certificate @LIVE@/origin.example.net/fullchain.pem;
  ssl_certificate_key @LIVE@/origin.example.net/privkey.pem;
  include snippets/ssl-options.conf;
  location /app/ {
    proxy_pass https://origin.example.com;
    proxy_buffering off;
  }
  location /legacy/ {
    proxy_pass https://198.51.100.20:8443;
    proxy_buffering off;
  }
  location / { return 404; }
}
