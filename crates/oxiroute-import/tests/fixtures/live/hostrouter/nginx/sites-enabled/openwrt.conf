server {
    listen 80;
    listen [::]:80;
    server_name openwrt.brauliobo.org;

    location / {
        proxy_pass http://whitebeast.lan:18080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name openwrt.brauliobo.org;

    ssl_certificate /etc/letsencrypt/live/brauliobo.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/brauliobo.org/privkey.pem;
    include letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass http://whitebeast.lan:18080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

