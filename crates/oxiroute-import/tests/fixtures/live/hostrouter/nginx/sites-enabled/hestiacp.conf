server {
  server_name .prabhatsamgiita.org ;

  location / { 
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Host $host;
    proxy_pass https://10.0.11.211;
    proxy_buffering off;
  }   

  listen 443 ssl; # managed by Certbot
  listen [::]:443 ssl;
  ssl_certificate /etc/letsencrypt/live/prabhatsamgiita.org/fullchain.pem; # managed by Certbot
  ssl_certificate_key /etc/letsencrypt/live/prabhatsamgiita.org/privkey.pem; # managed by Certbot
  include letsencrypt/options-ssl-nginx.conf; # managed by Certbot
  ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

