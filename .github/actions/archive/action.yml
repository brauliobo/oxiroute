name: Fetch the test archive
description: Installs nextest and downloads the workspace test archive that the archive job built; the scripts/test lanes extract and run it.

runs:
  using: composite
  steps:
    - name: Install Rust 1.97.1
      uses: dtolnay/rust-toolchain@1.97.1

    - name: Install nextest 0.9.150
      uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68 # v2.88.1
      with:
        tool: nextest@0.9.150

    - name: Download the test archive
      uses: actions/download-artifact@v4
      with:
        name: test-archive
        path: ${{ runner.temp }}/archive

    - name: Point the lanes at the archive
      shell: bash
      run: printf 'OXIROUTE_TEST_ARCHIVE=%s\n' "${RUNNER_TEMP}/archive/tests.tar.zst" >> "${GITHUB_ENV}"
