http {
  access_log off;
  ssl_protocols TLSv1.2 TLSv1.3;
  server {
    listen 192.0.2.10:443 ssl http2 default_server;
    server_name a.example.com;
    ssl_certificate @LIVE@/example.com/fullchain.pem;
    ssl_certificate_key @LIVE@/example.com/privkey.pem;
    location / { return 204; }
  }
  server {
    listen 192.0.2.10:443 ssl;
    server_name b.example.com;
    ssl_certificate @LIVE@/example.com/fullchain.pem;
    ssl_certificate_key @LIVE@/example.com/privkey.pem;
    http2 on;
    location / { return 204; }
  }
  server {
    listen 192.0.2.10:443 ssl;
    server_name c.example.com;
    ssl_certificate @LIVE@/example.com/fullchain.pem;
    ssl_certificate_key @LIVE@/example.com/privkey.pem;
    location / { return 204; }
  }
}
