server {
  listen 80 default_server;
  listen [::]:80 default_server;
  server_name _;
  location / { return 302 https://$host$request_uri; }
}
server {
  listen 443 ssl default_server;
  listen [::]:443 ssl default_server;
  server_name _;
  ssl_certificate @LIVE@/example.com/fullchain.pem;
  ssl_certificate_key @LIVE@/example.com/privkey.pem;
  include snippets/ssl-options.conf;
  location / { return 404; }
}
