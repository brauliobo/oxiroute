events {}
http {
  access_log off;
  server {
    listen 192.0.2.10:80 default_server;
    server_name example.com;
    location ^~ /.well-known/acme-challenge/ {
      root /var/www/letsencrypt;
      default_type text/plain;
      try_files $uri =404;
    }
    location / { return 301 https://$host$request_uri; }
  }
}
