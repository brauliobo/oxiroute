global
  log /dev/log local0
  chroot /var/lib/haproxy
  user haproxy
  group haproxy
  daemon
  maxconn 4096

defaults phoenix_defaults
  log global
  mode http
  option httplog
  option forwardfor except 127.0.0.0/8
  retries 3
  option redispatch
  timeout connect 5s
  timeout client 50s
  timeout server 50s
  timeout http-request 10s
  timeout http-keep-alive 10s

frontend phoenix
  bind /run/haproxy/phoenix.sock
  maxconn 2000
  acl phoenix_host hdr(host) -i phoenix.lan
  use_backend phoenix_nodes if phoenix_host
  default_backend phoenix_nodes

backend phoenix_nodes
  balance leastconn
  option httpchk GET /healthz
  http-check expect status 200
  server phoenix01 phoenix01.lan:4000 check inter 2s rise 2 fall 3
  server phoenix02 phoenix02.lan:4000 check inter 2s rise 2 fall 3
  server phoenix03 phoenix03.lan:4000 check inter 2s rise 2 fall 3
  server phoenix04 phoenix04.lan:4000 check inter 2s rise 2 fall 3
  server phoenix05 phoenix05.lan:4000 check inter 2s rise 2 fall 3
  server phoenix06 phoenix06.lan:4000 check inter 2s rise 2 fall 3
  server phoenix07 phoenix07.lan:4000 check inter 2s rise 2 fall 3
  server phoenix08 phoenix08.lan:4000 check inter 2s rise 2 fall 3
