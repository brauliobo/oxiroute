server {
    listen 10.0.0.10:8096 ssl;
    server_name 10.0.0.10;

    ssl_certificate     /etc/nginx/ssl/opencode-10.0.0.10.crt;
    ssl_certificate_key /etc/nginx/ssl/opencode-10.0.0.10.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    client_max_body_size 100M;

    location / {
        proxy_pass http://10.0.0.10:4096;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  8096;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";

        proxy_buffering off;
        proxy_cache     off;
    }
}

