server { 
  server_name scrapers.yellowmaverick.com;
  listen 80;
  listen [::]:80;

  location / { 
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Host $host;
    proxy_pass http://10.0.11.207:80;
    proxy_buffering off;
  }   

  listen 443 ssl; # managed by Certbot
  listen [::]:443 ssl;
  ssl_certificate /etc/letsencrypt/live/yellowmaverick.com/fullchain.pem; # managed by Certbot
  ssl_certificate_key /etc/letsencrypt/live/yellowmaverick.com/privkey.pem; # managed by Certbot
  include letsencrypt/options-ssl-nginx.conf; # managed by Certbot
  ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

upstream haproxy {
   server unix:/var/run/haproxy.sock;
}

server { 
  server_name ollama.yellowmaverick.com;
  listen 80;
  listen [::]:80;

  location / { 
        if ($http_authorization != "<redacted>") {
      return 401;
    }

proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Host $host;

    proxy_pass http://haproxy;
    proxy_buffering off;
  }   

  listen 443 ssl; # managed by Certbot
  listen [::]:443 ssl;
  ssl_certificate /etc/letsencrypt/live/yellowmaverick.com/fullchain.pem; # managed by Certbot
  ssl_certificate_key /etc/letsencrypt/live/yellowmaverick.com/privkey.pem; # managed by Certbot
  include letsencrypt/options-ssl-nginx.conf; # managed by Certbot
  ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
  server_name ollama-webui.yellowmaverick.com;
  listen 80;
  listen [::]:80;

  location / { 
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "Upgrade";
    proxy_set_header Host $host;
    proxy_pass http://whitebeast.lan:7001;
    proxy_buffering off;
  }   

  listen 443 ssl; # managed by Certbot
  listen [::]:443 ssl;
  ssl_certificate /etc/letsencrypt/live/yellowmaverick.com/fullchain.pem; # managed by Certbot
  ssl_certificate_key /etc/letsencrypt/live/yellowmaverick.com/privkey.pem; # managed by Certbot
  include letsencrypt/options-ssl-nginx.conf; # managed by Certbot
  ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}


