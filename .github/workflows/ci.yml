name: Verify release gates

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_DEV_DEBUG: none

jobs:
  lint:
    name: Format, repository gates and clippy
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust 1.97.1
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: clippy, rustfmt

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Test and verify the source file size limit and name prefixes
        run: |
          ./scripts/test/line_limit.sh
          ./scripts/test/name_prefixes.sh
          ./scripts/verify/line_limit.sh
          ./scripts/verify/name_prefixes.sh
          ./scripts/verify/return_traps.sh

      - name: Test and verify the CI cache keys
        run: |
          ./scripts/test/rust_cache_keys.sh
          ./scripts/verify/rust_cache_keys.sh

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: lint
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Verify the generated control-plane types match the OpenAPI artifact
        run: node scripts/generate/control-plane-types.mjs --check

      - name: Verify unsafe code and raw io_uring stay in their crate
        run: ./scripts/verify/unsafe_containment.sh

      - name: Verify every test binary is in a test tier
        run: ./scripts/ci/tiers.sh check

      - name: Lint the test lane scripts
        run: shellcheck -x -P SCRIPTDIR scripts/test/{all,core,doc,planes,slow,tls}.sh scripts/ci/{probe,test_budget,tiers}.sh scripts/lib/nextest.sh

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --locked --jobs 4 -- -D warnings

  archive:
    name: Build the workspace tests once
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust 1.97.1
        uses: dtolnay/rust-toolchain@1.97.1

      - name: Install nextest 0.9.150
        uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68 # v2.88.1
        with:
          tool: nextest@0.9.150

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: tests
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Archive every workspace test binary
        run: cargo nextest archive --workspace --locked --build-jobs 4 --archive-file "${RUNNER_TEMP}/tests.tar.zst"

      - name: Share the archive with the test jobs
        uses: actions/upload-artifact@v4
        with:
          name: test-archive
          path: ${{ runner.temp }}/tests.tar.zst
          retention-days: 1
          compression-level: 0

  doc:
    name: Documentation tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust 1.97.1
        uses: dtolnay/rust-toolchain@1.97.1

      - name: Restore the Cargo dependencies the archive job built
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: tests
          save-if: false

      - name: Run the documentation tests
        run: ./scripts/test/doc.sh

  core:
    name: Plane-independent tests
    needs: archive
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Fetch the test archive
        uses: ./.github/actions/archive

      - name: Run the core tier on the default plane chain
        run: ./scripts/test/core.sh

  planes:
    name: ${{ matrix.plane }} data plane
    needs: archive
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        plane: [tokio, epoll, io_uring]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Fetch the test archive
        uses: ./.github/actions/archive

      - name: Run the plane-sensitive tiers on ${{ matrix.plane }}
        env:
          OXIROUTE_RAISE_MEMLOCK: ${{ matrix.plane == 'io_uring' && '1' || '' }}
        run: ./scripts/test/planes.sh ${{ matrix.plane }}

  tls:
    name: ${{ matrix.backend }} TLS backend
    needs: archive
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        backend: [openssl, rustls]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Fetch the test archive
        uses: ./.github/actions/archive

      - name: Run the TLS tier on ${{ matrix.backend }}
        run: ./scripts/test/tls.sh ${{ matrix.backend }}

  cpu-targets:
    name: Generic and native CPU dispatch
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust 1.97.1
        uses: dtolnay/rust-toolchain@1.97.1

      - name: Identify the runner CPU
        id: cpu
        run: echo "id=$(./scripts/lib/cpu_id.sh)" >> "$GITHUB_OUTPUT"

      - name: Cache Cargo dependencies per CPU
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ steps.cpu.outputs.id }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install CPU emulator
        run: sudo apt-get update && sudo apt-get install --yes qemu-user

      - name: Verify the dispatch tests on baseline, SSSE3, AVX2 and native CPUs
        run: ./scripts/test/cpu-targets.sh

  release-archive:
    name: Release archive policy
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Test the release archive policy
        run: ./scripts/test/release/archive.sh

      - name: Test the release binary build gates
        run: |
          ./scripts/test/verify/binary-paths.sh
          ./scripts/test/verify/baseline-isa.sh
          ./scripts/test/stage_time.sh
          ./benchmarks/scripts/test-pgo.sh

      - name: Build and verify the source archive from the commit under test
        run: ./scripts/create-release-archive.sh "${RUNNER_TEMP}/oxiroute-ci.tar.gz" ci

  fuzz-contract:
    name: Bounded fuzz harness and corpus contract
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust 1.97.1
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt

      - name: Verify every checked-in fuzz target and seed
        run: ./scripts/verify/fuzz.sh

  package:
    name: Arch package service metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate service and package lifecycle metadata
        run: ./packaging/arch/test/service.sh

      - name: Verify the package recipes pin the checksums of the files they ship
        run: |
          ./packaging/arch/test/verify-checksums.sh
          ./packaging/arch/test/pin-bin-release.sh
          ./packaging/arch/test/package-files.sh
          ./packaging/arch/verify-checksums.sh

  ui:
    name: UI tests and build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust 1.97.1
        uses: dtolnay/rust-toolchain@1.97.1

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ui
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.3.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml

      - name: Install UI dependencies
        run: pnpm install --frozen-lockfile --prefer-offline
        working-directory: ui

      - name: Build management process for API integration tests
        run: nice cargo +1.97.1 build -p oxiroute --bin oxiroute --locked --jobs 4

      - name: Run UI tests
        run: pnpm test -- --maxWorkers=4 --minWorkers=1
        working-directory: ui

      - name: Build UI
        run: pnpm build
        working-directory: ui

      - name: Verify the UI bundle has no VDOM renderer
        run: pnpm verify:bundle
        working-directory: ui

      - name: Lint the design system styles and hold the console to its colour and duplicate-class baselines
        run: pnpm verify:css
        working-directory: ui

  stats-ui:
    name: Stats page build, embedded assets and browser tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      NO_PROXY: 127.0.0.1,localhost
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.3.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('ui/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install UI dependencies
        run: pnpm install --frozen-lockfile --prefer-offline
        working-directory: ui

      - name: Verify the generated stats page types match the contract
        run: pnpm verify:stats-page
        working-directory: ui

      - name: Build the stats page and check its bundle and size budget
        run: pnpm build:stats
        working-directory: ui

      - name: Verify embedded stats page assets are what the UI builds
        run: ./scripts/verify/stats/assets.sh

      - name: Build the dashboard (Playwright starts its preview server too)
        run: pnpm build
        working-directory: ui

      - name: Install Chromium and Linux dependencies
        run: pnpm exec playwright install --with-deps chromium
        working-directory: ui

      - name: Run stats page and design gallery browser tests with bounded workers
        run: pnpm exec playwright test --project=stats-chromium --project=stats-mobile-chromium --project=gallery-chromium --workers=2
        working-directory: ui

      - name: Upload stats page browser diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: stats-page-browser-diagnostics
          path: |
            ui/test-results
            ui/playwright-report

  browser:
    name: Deterministic dashboard browser tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      NO_PROXY: 127.0.0.1,localhost
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.3.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('ui/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install UI dependencies
        run: pnpm install --frozen-lockfile --prefer-offline
        working-directory: ui

      - name: Type-check browser tests
        run: pnpm typecheck:browser
        working-directory: ui

      - name: Build UI
        run: pnpm build
        working-directory: ui

      - name: Verify the UI bundle has no VDOM renderer
        run: pnpm verify:bundle
        working-directory: ui

      - name: Build the stats page (Playwright starts its preview server too)
        run: pnpm build:stats
        working-directory: ui

      - name: Install Chromium and Linux dependencies
        run: pnpm exec playwright install --with-deps chromium
        working-directory: ui

      - name: Run dashboard browser tests with bounded workers
        run: pnpm test:browser --project=desktop-chromium --project=mobile-chromium --workers=2
        working-directory: ui

      - name: Upload browser diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-browser-diagnostics
          path: |
            ui/test-results
            ui/playwright-report
