http {
  access_log off;
  client_max_body_size 1m;
  proxy_connect_timeout 30s;
  proxy_read_timeout 30s;
  proxy_send_timeout 30s;
  proxy_http_version 1.1;
  proxy_buffering off;
  proxy_request_buffering off;
  proxy_next_upstream off;
  proxy_next_upstream_tries 1;
  proxy_set_header Host $http_host;
  proxy_ignore_headers X-Accel-Redirect X-Accel-Expires X-Accel-Limit-Rate X-Accel-Buffering X-Accel-Charset;

  upstream local_application {
    server 127.0.0.1:8080;
  }

  upstream lan_application {
    server application.internal.lan:8080;
  }

  server {
    listen 127.0.0.1:8088 default_server;
    server_name local.example.test;
    location / { proxy_pass http://local_application; }
  }

  server {
    listen [::1]:8089;
    server_name lan.example.test;
    location / { proxy_pass http://lan_application; }
  }
}
