name: Dependency, license, and source audit

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: audit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: 0
  CARGO_BUILD_JOBS: 4
  CARGO_TERM_COLOR: always

jobs:
  cargo-policy:
    name: Rust dependency, license, and source policy
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust 1.97.1
        uses: dtolnay/rust-toolchain@1.97.1

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-policy-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-policy-

      - name: Fetch locked Rust dependencies
        run: cargo +1.97.1 fetch --locked

      - name: Install pinned cargo-deny
        run: cargo +1.97.1 install cargo-deny --version 0.18.3 --locked

      - name: Check bans, licenses, and sources
        run: cargo deny check bans licenses sources --disable-fetch --hide-inclusion-graph

  cargo-audit:
    name: RustSec audit database scan
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust 1.97.1
        uses: dtolnay/rust-toolchain@1.97.1

      - name: Cache Cargo and RustSec database
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/advisory-db
            ~/.cargo/bin/cargo-audit
          key: ${{ runner.os }}-cargo-audit-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-audit-

      - name: Install pinned cargo-audit
        run: cargo +1.97.1 install cargo-audit --version 0.22.1 --locked

      - name: Deny vulnerabilities and audit warnings
        run: cargo audit -D warnings

  ui-dependencies:
    name: UI lockfile and vulnerability audit
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.3.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml

      - name: Install locked UI dependencies
        run: pnpm install --frozen-lockfile --prefer-offline
        working-directory: ui

      - name: Audit high and critical UI advisories
        run: pnpm audit --audit-level high
        working-directory: ui
