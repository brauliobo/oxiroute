worker_processes 1;
master_process off;
daemon off;
pid /home/braulio/Projects/oxiroute/benchmarks/generated/runs/publish-final-retained-b/runtime/nginx-proxy.pid;
error_log /home/braulio/Projects/oxiroute/benchmarks/generated/runs/publish-final-retained-b/logs/nginx-proxy-error.log notice;

events {
  worker_connections 4096;
}

http {
  access_log off;
  server_tokens off;

  upstream benchmark_origin {
    server 127.0.0.1:49080;
    keepalive 128;
  }

  server {
    listen 127.0.0.1:49081;
    keepalive_timeout 1h;
    keepalive_requests 100000000;

    location / {
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $http_host;
      proxy_pass http://benchmark_origin;
    }
  }
}
