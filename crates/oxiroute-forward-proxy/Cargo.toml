[package]
name = "oxiroute-forward-proxy"
version = "0.5.2"
edition = "2024"
rust-version = "1.97"
license = "Apache-2.0"
repository = "https://github.com/brauliobo/oxiroute"
description = "Protocol-neutral explicit forward proxy foundation for OxiRoute"
readme = "README.md"

[dependencies]
async-trait = "0.1"
bytes = "1"
h3 = "0.0.8"
http = "1"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "sync", "time"] }

[dev-dependencies]
h2 = "0.4.15"
h3 = { version = "0.0.8", features = ["i-implement-a-third-party-backend-and-opt-into-breaking-changes"] }
h3-quinn = "0.0.10"
http-body-util = "0.1"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
quinn = { version = "0.11.9", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
rcgen = "0.13.2"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
pedantic = "warn"
