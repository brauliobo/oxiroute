worker_processes 1;
master_process off;
daemon off;
pid /home/braulio/Projects/oxiroute/benchmarks/generated/runs/publish-final-oxiroute-b/runtime/nginx-origin.pid;
error_log /home/braulio/Projects/oxiroute/benchmarks/generated/runs/publish-final-oxiroute-b/logs/nginx-origin-error.log notice;

events {
  worker_connections 4096;
}

http {
  access_log off;
  server_tokens off;

  server {
    listen 127.0.0.1:49080;
    keepalive_timeout 1h;
    keepalive_requests 100000000;

    location = /healthz {
      default_type text/plain;
      return 200 "ok\n";
    }

    location = /payload {
      default_type application/octet-stream;
      return 200 "";
    }
  }
}
