name: Platform matrix gate

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  platform:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            label: Linux required workspace check
            full_build: true
            gate: 'Required platform: full workspace check runs here.'
          - os: macos-14
            label: macOS metadata gate
            full_build: false
            gate: 'Gated: Linux-only /proc and Unix supervision paths are not claimed on macOS.'
          - os: windows-2025
            label: Windows metadata gate
            full_build: false
            gate: 'Gated: Linux-only daemon packaging and Unix supervision paths are not claimed on Windows.'
    env:
      CARGO_INCREMENTAL: 0
      CARGO_BUILD_JOBS: 4
      CARGO_TERM_COLOR: always
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust 1.97.1
        uses: dtolnay/rust-toolchain@1.97.1

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-platform-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-platform-

      - name: Verify locked workspace metadata
        run: cargo +1.97.1 metadata --format-version 1 --no-deps --locked

      - name: Run required Linux workspace check
        if: matrix.full_build
        run: cargo +1.97.1 check --workspace --locked --jobs 4

      - name: Record unsupported-platform gate
        if: ${{ !matrix.full_build }}
        shell: bash
        run: |
          printf '%s\n' '${{ matrix.gate }}'
          printf '%s\n' 'Metadata validation above is the executable placeholder; no unsupported runtime claim is made.'
