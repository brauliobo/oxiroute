events {}

rtmp {
    server {
        listen 127.0.0.1:1935;

        application safe {
            live on;
            idle_streams on;
            record all;
            record_path /var/lib/oxiroute/safe-recordings;
            record_suffix .flv;
            record_unique off;
        }
    }

    server {
        listen 127.0.0.1:1936;
        ping 30s;

        application phoenix {
            live on;
            idle_streams off;
            record all;
            record_path /srv/phoenix/recordings;
            record_suffix -%Y-%m-%d.flv;
            record_unique on;
            record_max_size 4G;
            on_publish http://127.0.0.1:8080/auth;
        }
    }
}
