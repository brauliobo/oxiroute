# Synthetic nginx HTTP fragment: DNS-named upstream shared by a plaintext and a Unix listener.
http {
  access_log off;
  proxy_http_version 1.1;
  proxy_buffering off;
  proxy_request_buffering off;
  proxy_next_upstream off;
  proxy_next_upstream_tries 1;
  proxy_ignore_headers X-Accel-Redirect X-Accel-Expires X-Accel-Limit-Rate X-Accel-Buffering X-Accel-Charset;

  upstream api_nodes {
    server api01.example.net:8080;
    server api02.example.net:8080;
  }

  server {
    listen 127.0.0.1:18080 default_server;
    server_name api.example.org;
    location / { proxy_pass http://api_nodes; }
  }

  server {
    listen unix:/run/nginx/synthetic.sock;
    server_name internal.example.org;
    location / { proxy_pass http://api_nodes; }
  }
}
