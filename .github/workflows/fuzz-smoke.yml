name: Optional parser fuzz smoke

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz-smoke:
    name: Bounded parser harness smoke
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust 1.97.1
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt

      - name: Verify bounded fuzz targets and crash-corpus seeds
        run: ./scripts/verify-fuzz.sh

      - name: Run optional cargo-fuzz smoke when tooling is available
        run: bash fuzz/smoke.sh
