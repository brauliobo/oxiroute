server {
  if ($host = example.org) {
    return 301 https://$host$request_uri;
  }
  listen 80;
  listen [::]:80;
  server_name example.org;
  return 404;
}
server {
  listen 443 ssl;
  listen [::]:443 ssl;
  server_name example.org;
  ssl_certificate @LIVE@/example.org/fullchain.pem;
  ssl_certificate_key @LIVE@/example.org/privkey.pem;
  include snippets/ssl-options.conf;
  location / { return 404; }
}
