
server { 
  listen 80;
  listen [::]:80;
  server_name op.pzt.app;
  location / { 
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_pass http://10.0.7.34:10130;
    proxy_buffering off;
  }   

  listen 443 ssl; # managed by Certbot
  listen [::]:443 ssl;
  ssl_certificate /etc/letsencrypt/live/pzt.app/fullchain.pem; # managed by Certbot
  ssl_certificate_key /etc/letsencrypt/live/pzt.app/privkey.pem; # managed by Certbot
  include letsencrypt/options-ssl-nginx.conf; # managed by Certbot
  ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

