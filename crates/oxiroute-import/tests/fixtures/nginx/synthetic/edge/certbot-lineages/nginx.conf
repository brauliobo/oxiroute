http {
  access_log off;
  ssl_protocols TLSv1.2 TLSv1.3;
  server {
    listen 192.0.2.10:443 ssl default_server;
    server_name a.example.com;
    ssl_certificate @LIVE@/example.com/fullchain.pem;
    ssl_certificate_key @LIVE@/example.com/privkey.pem;
    location / { return 204; }
  }
  server {
    listen 192.0.2.10:443 ssl;
    server_name b.example.com;
    ssl_certificate @LIVE@/example.com/fullchain.pem;
    ssl_certificate_key @LIVE@/example.com/privkey.pem;
    location / { return 204; }
  }
  server {
    listen 192.0.2.10:443 ssl;
    server_name example.org;
    ssl_certificate @LIVE@/example.org/fullchain.pem;
    ssl_certificate_key @LIVE@/example.org/privkey.pem;
    location / { return 204; }
  }
  server {
    listen 192.0.2.10:443 ssl;
    server_name c.example.net;
    ssl_certificate @LIVE@/example.com/fullchain.pem;
    ssl_certificate_key @LIVE@/example.com/privkey.pem;
    location / { return 204; }
  }
}
