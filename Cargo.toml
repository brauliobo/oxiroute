[workspace]
members = [
    "crates/oxiroute-cache",
    "crates/oxiroute-config",
    "crates/oxiroute-config-source",
    "crates/oxiroute-forward-proxy",
    "crates/oxiroute-import",
    "crates/oxiroute-rtmp",
    "crates/oxiroute-server",
]
exclude = ["vendor/pingora-core", "vendor/pingora-proxy"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/brauliobo/oxiroute"
rust-version = "1.87"
version = "0.1.0"

[workspace.dependencies]
arc-swap = "1.9"
async-trait = "0.1"
base64 = "0.22"
bcrypt = "0.17"
bytes = "1"
chrono = "0.4"
chrono-tz = "0.10"
clap = { version = "4.5", features = ["derive", "env"] }
env_logger = "0.11"
futures-util = "0.3"
h2 = "0.4.15"
hocon-parser = { version = "=1.11.0", features = ["serde"] }
http = "1"
httpdate = "1"
log = "0.4"
kdl = { version = "=6.5.0", default-features = false }
mlua = { version = "0.11", features = ["lua54", "serialize", "vendored"] }
notify = "8.2"
openssl = "0.10.81"
pingora = { version = "0.8.0", features = ["lb", "openssl", "proxy"] }
rml_rtmp = "=0.8.0"
rustix = { version = "1.1", features = ["fs"] }
rustls = { version = "0.23.40", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "2.2.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
signal-hook = "0.3"
tempfile = "3"
thiserror = "2"
time = { version = "0.3.45", features = ["formatting", "local-offset", "macros"] }
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "sync", "time"] }
tokio-rustls = { version = "0.26.4", default-features = false, features = ["ring", "tls12"] }
tokio-tungstenite = { version = "0.26", default-features = false, features = ["connect"] }
uuid = { version = "1", features = ["v4"] }
x509-parser = "0.18.1"
zeroize = "1.9"

[patch.crates-io]
h3 = { git = "https://github.com/hyperium/h3", rev = "e07e69412876f7e26f026bd75a48b2704d8c8283" }
pingora-core = { path = "vendor/pingora-core" }
pingora-proxy = { path = "vendor/pingora-proxy" }
rml_rtmp = { path = "vendor/rml_rtmp" }

[profile.release]
codegen-units = 1
lto = "fat"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
