name: Release archive and provenance

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag or ref to archive and verify
        required: true
        type: string
      pgo:
        description: Build the release binaries with profile-guided optimization (false publishes a plain build)
        required: false
        default: true
        type: boolean
      bolt:
        description: Lay out the release binaries with BOLT after profile-guided optimization (false skips the stage)
        required: false
        default: true
        type: boolean
      abort_flavour:
        description: Also build and publish the fail-fast panic=abort flavour (a tag always publishes it)
        required: false
        default: true
        type: boolean

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  archive:
    name: Verify release archive and provenance
    runs-on: ubuntu-24.04
    env:
      CARGO_INCREMENTAL: 0
      CARGO_BUILD_JOBS: 3
    steps:
      - name: Check out release ref
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}

      - name: Install Rust 1.97.1
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.3.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            ui/pnpm-lock.yaml
            remotion/pnpm-lock.yaml

      - name: Verify locked workspace metadata at MSRV
        run: cargo +1.97.1 metadata --format-version 1 --no-deps --locked

      - name: Verify control-plane OpenAPI artifact
        run: ./scripts/verify-control-plane-contract.sh

      - name: Verify all committed lockfiles are current
        run: ./scripts/verify-lockfiles.sh

      - name: Verify bounded fuzz targets and crash-corpus seeds
        run: ./scripts/verify-fuzz.sh

      - name: Select release version
        run: |
          version="${{ inputs.tag || github.ref_name }}"
          version="${version#v}"
          printf 'RELEASE_VERSION=%s\n' "${version}" >> "${GITHUB_ENV}"

      - name: Verify version metadata
        run: ./scripts/verify-release-version.sh "${RELEASE_VERSION}"

      - name: Test release archive policy
        run: ./scripts/test-release-archive.sh

      - name: Create and verify deterministic source archive
        run: |
          mkdir -p release
          ./scripts/create-release-archive.sh "release/oxiroute-${RELEASE_VERSION}.tar.gz" "${RELEASE_VERSION}"

      - name: Verify PKGBUILD checksum matches the release archive
        run: |
          source packaging/arch/PKGBUILD
          expected="${sha256sums[0]}"
          actual="$(sha256sum "release/oxiroute-${RELEASE_VERSION}.tar.gz")"
          actual="${actual%% *}"
          [[ "${actual}" == "${expected}" ]] || {
            printf 'PKGBUILD checksum is not synchronized with the generated archive\nexpected: %s\nactual:   %s\n' "${expected}" "${actual}" >&2
            exit 1
          }

      - name: Write checksums and source provenance
        run: |
          archive="release/oxiroute-${RELEASE_VERSION}.tar.gz"
          sha256sum "${archive}" > release/SHA256SUMS
          commit="$(git rev-parse HEAD)"
          source_date_epoch="$(git log -1 --format=%ct HEAD)"
          checksum="$(cut -d' ' -f1 release/SHA256SUMS)"
          printf '{\n  "schema": "oxiroute.release-provenance.v1",\n  "version": "%s",\n  "commit": "%s",\n  "source_date_epoch": %s,\n  "archive_sha256": "%s"\n}\n' \
            "${RELEASE_VERSION}" "${commit}" "${source_date_epoch}" "${checksum}" > release/SOURCE-PROVENANCE.json

      - name: Upload release verification files
        uses: actions/upload-artifact@v4
        with:
          name: oxiroute-release-${{ inputs.tag || github.ref_name }}
          path: release

      - name: Attest release archive provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: release/oxiroute-*.tar.gz

      - name: Publish tagged release assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release/oxiroute-*.tar.gz
            release/SHA256SUMS
            release/SOURCE-PROVENANCE.json

  binaries:
    name: Build ${{ matrix.target }} ${{ matrix.flavour }} release binaries
    needs: archive
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 300
    strategy:
      fail-fast: false
      # One flavour at a time: both append their line to the same release notes.
      max-parallel: 1
      matrix:
        target: [x86_64-unknown-linux-gnu]
        flavour: ${{ fromJSON((github.event_name == 'workflow_dispatch' && !inputs.abort_flavour) && '["unwind"]' || '["unwind","abort"]') }}
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
    env:
      CARGO_INCREMENTAL: 0
      PGO_TARGET: ${{ matrix.target }}
      PGO: ${{ (github.event_name == 'workflow_dispatch' && !inputs.pgo) && '0' || '1' }}
      BOLT: ${{ (github.event_name == 'workflow_dispatch' && !inputs.bolt) && '0' || '1' }}
      FLAVOUR: ${{ matrix.flavour }}
    steps:
      - name: Check out release ref
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Install Rust 1.97.1 with the matching llvm-profdata
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          targets: ${{ matrix.target }}
          components: llvm-tools

      - name: Install BOLT (pinned package, SHA-256 verified)
        if: env.BOLT == '1'
        run: |
          bin="$(./scripts/install-bolt.sh "${RUNNER_TEMP}/bolt")"
          printf 'BOLT_BIN_DIR=%s\n' "${bin}" >> "${GITHUB_ENV}"

      - name: Build release binaries (profile-guided and BOLT-laid-out unless disabled)
        env:
          RELEASE_REF: ${{ inputs.tag || github.ref_name }}
          PGO_WORK: ${{ runner.temp }}/pgo
        run: ./scripts/build-release-binaries.sh "${RELEASE_REF#v}" release-binaries

      - name: Upload release binaries
        uses: actions/upload-artifact@v4
        with:
          name: oxiroute-binaries-${{ matrix.target }}-${{ matrix.flavour }}-${{ inputs.tag || github.ref_name }}
          path: release-binaries

      - name: Attest release binary provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: release-binaries/oxiroute-*.tar.gz

      - name: Publish tagged release binaries
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          append_body: true
          body_path: release-binaries/pgo-note-${{ matrix.target }}${{ matrix.flavour == 'abort' && '-abort' || '' }}.md
          files: |
            release-binaries/oxiroute-*.tar.gz
            release-binaries/oxiroute-*.tar.gz.sha256
            release-binaries/oxiroute-*.build.json
