rtmp {
  access_log  off;

  server {
    listen 1935;
    chunk_size 4096; # Default, but good to have

    application live {
      live on;

      #wait_key on;
      #wait_video on;
      #drop_idle_publisher 30s;

      #hls_fragment 0s;
      record all;
      record_path /mnt/4tb/cam-rtmp;
      record_unique on;
      record_interval 1h;
      record_suffix -%Y%m%d_%H%M%S.mp4;

      # -- Add HLS Block --
      #hls on;
      #hls_path /var/www/html/hls;
      #hls_fragment 3s;
      #hls_playlist_length 60s;

      push rtmp://127.0.0.1:1936/$name;
    }

  }
}

