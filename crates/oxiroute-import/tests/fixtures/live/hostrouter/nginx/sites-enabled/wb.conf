
server { 
  listen 80;
  listen [::]:80;
  server_name whitebeast.brauliobo.org;
  location / { 
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Host $host;
    proxy_pass http://whitebeast.lan:80;
    proxy_buffering off;
  }   

  listen 443 ssl; # managed by Certbot
  listen [::]:443 ssl;
  ssl_certificate /etc/letsencrypt/live/brauliobo.org/fullchain.pem; # managed by Certbot
  ssl_certificate_key /etc/letsencrypt/live/brauliobo.org/privkey.pem; # managed by Certbot
  include letsencrypt/options-ssl-nginx.conf; # managed by Certbot
  ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}


