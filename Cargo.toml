[workspace]
members = [
    "crates/oxiroute-cache",
    "crates/oxiroute-acme",
    "crates/oxiroute-config",
    "crates/oxiroute-config-source",
    "crates/oxiroute-forward-proxy",
    "crates/oxiroute-import",
    "crates/oxiroute-rtmp",
    "crates/oxiroute-server",
    "crates/oxiroute-supervisor-master",
    "crates/oxiroute-supervisor-process",
    "crates/oxiroute-supervision",
    "crates/oxiroute-supervision-unix",
    "vendor/pingora-proxy",
]
exclude = [
    "vendor/pingora-core",
    "vendor/pingora-load-balancing",
    "vendor/pingora-rustls",
    "vendor/pingora-timeout",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/brauliobo/oxiroute"
rust-version = "1.97"
version = "6.1.0"

[workspace.dependencies]
aho-corasick = "1.1.5"
arc-swap = "1.9.4"
async-trait = "0.1.92"
base64 = "0.23"
bcrypt = "0.19"
bytes = "1.12"
chrono = "0.4.45"
chrono-tz = "0.10.4"
clap = { version = "4.6.7", features = ["derive", "env"] }
env_logger = "0.11"
futures-util = "0.3.34"
h2 = "0.4.20"
h3 = { version = "0.0.8", features = ["i-implement-a-third-party-backend-and-opt-into-breaking-changes"] }
h3-quinn = "0.0.10"
hocon-parser = { version = "=1.14.2", features = ["serde"] }
http = "1.5"
httpdate = "1"
http-body-util = "0.1.5"
hyper = { version = "1.12", features = ["client", "http1", "server"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
hickory-resolver = { version = "0.26.3", default-features = false, features = ["system-config", "tokio"] }
log = "0.4.35"
local-ip-address = "0.6.13"
kdl = { version = "=6.7.1", default-features = false }
mlua = { version = "0.12", features = ["lua54", "serialize", "vendored"] }
notify = "8.2"
openssl = "0.10.82"
pingora = { version = "=0.8.1", features = ["lb", "openssl", "proxy"] }
quinn = { version = "0.11.12", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
rml_rtmp = "=0.8.0"
rustix = { version = "1.1.6", features = ["event", "fs", "net", "process", "stdio"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8.5"
rustls-pki-types = { version = "1.15.1", features = ["std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11"
signal-hook = "0.4"
tempfile = "3.27"
thiserror = "2.0.21"
time = { version = "0.3.55", features = ["formatting", "local-offset", "macros"] }
tokio = { version = "1.54", features = ["fs", "io-util", "macros", "net", "sync", "time"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect"] }
tokio-openssl = "0.6"
uuid = { version = "1.29", features = ["v4"] }
x509-parser = "0.18.1"
zeroize = "1.9.1"

[patch.crates-io]
h3 = { git = "https://github.com/hyperium/h3", rev = "43745ad87e95b0c035ac9c547aad467303213425" }
pingora-core = { path = "vendor/pingora-core" }
pingora-load-balancing = { path = "vendor/pingora-load-balancing" }
pingora-proxy = { path = "vendor/pingora-proxy" }
pingora-rustls = { path = "vendor/pingora-rustls" }
pingora-timeout = { path = "vendor/pingora-timeout" }
rml_rtmp = { path = "vendor/rml_rtmp" }

[profile.release]
codegen-units = 1
lto = "fat"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
