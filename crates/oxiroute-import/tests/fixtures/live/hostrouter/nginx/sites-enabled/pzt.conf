server { 
  listen 80;
  listen [::]:80;
  server_name stag.pzt.app;

  # ───────────────────── headers passed to the dev server ────────────────
  proxy_set_header  Host              $host;
  proxy_set_header  X-Real-IP         $remote_addr;
  proxy_set_header  X-Forwarded-For   $proxy_add_x_forwarded_for;
  proxy_set_header  X-Forwarded-Proto $scheme;
  proxy_set_header  Upgrade           $http_upgrade;
  proxy_buffering   off;              # HMR streams

  # ───────────────────── Web-socket / HMR end-points ─────────────────────
  location /__nuxt_hmr {              # Nuxt >= 3.17
      proxy_pass         http://10.0.7.34:3000;
      proxy_http_version 1.1;
      proxy_read_timeout 3600s;
  }

  # If you are on Nuxt < 3.17 keep these two lines as a fallback:
  # location /_nuxt_hmr { proxy_pass http://nuxt_dev; proxy_http_version 1.1; }

  # ───────────────────── Everything else (HTML, @vite, etc.) ─────────────
  location / {
      proxy_pass         http://10.0.7.34:3000;
      proxy_http_version 1.1;
      proxy_read_timeout 3600s;
  }

  listen 443 ssl; # managed by Certbot
  listen [::]:443 ssl;
  ssl_certificate /etc/letsencrypt/live/pzt.app/fullchain.pem; # managed by Certbot
  ssl_certificate_key /etc/letsencrypt/live/pzt.app/privkey.pem; # managed by Certbot
  include letsencrypt/options-ssl-nginx.conf; # managed by Certbot
  ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}


