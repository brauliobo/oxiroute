# Synthetic gateway: Unix listener, host-routed DNS pool with health checks, and a stats page.
# Every name and address is invented.
global
  maxconn 4096
  log stdout format raw local0
  user haproxy
  group haproxy

defaults gateway
  mode http
  log global
  retries 3
  option redispatch
  option httpchk GET /health
  timeout connect 5s
  timeout client 10m
  timeout server 10m
  timeout http-request 10m
  timeout http-keep-alive 1m

frontend gateway
  bind unix@/var/run/synthetic-gateway.sock mode 777
  acl host_api hdr(host) -i api.corp-a.test
  use_backend api_nodes if host_api

backend api_nodes
  balance leastconn
  http-check expect status 200
  default-server check inter 10s rise 2 fall 3
  server api01 api01.example.net:8080
  server api02 api02.example.net:8080
  server api03 api03.example.net:8081

frontend stats
  bind *:8404
  stats uri /stats
  stats refresh 10s
  stats admin if LOCALHOST
