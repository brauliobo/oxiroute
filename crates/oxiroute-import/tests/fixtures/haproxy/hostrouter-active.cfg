global
  log /dev/log local0
  chroot /var/lib/haproxy
  user haproxy
  group haproxy
  daemon
  maxconn 4096
  stats socket /run/haproxy/admin.sock

defaults hostrouter_defaults
  log global
  mode http
  option httplog
  option forwardfor except 127.0.0.0/8
  retries 3
  option redispatch
  timeout connect 5s
  timeout client 50s
  timeout server 50s
  timeout http-request 10s
  timeout http-keep-alive 10s

frontend hostrouter
  bind /run/haproxy/hostrouter.sock
  maxconn 2000
  acl app_host hdr(host) -i app.lan
  use_backend app_nodes if app_host
  default_backend app_nodes

backend app_nodes
  balance leastconn
  option httpchk GET /healthz
  http-check expect status 200
  server app01 app01.lan:3000 check inter 2s rise 2 fall 3
  server app02 app02.lan:3000 check inter 2s rise 2 fall 3

listen administration
  bind 127.0.0.1:1936
  stats enable
  stats uri /
  stats hide-version
  stats refresh 10s
  stats admin if LOCALHOST
