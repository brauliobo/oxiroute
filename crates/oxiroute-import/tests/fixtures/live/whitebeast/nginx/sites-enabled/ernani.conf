server {
  listen 80;
  server_name whitebeast.brauliobo.org;

  # Basic Authentication
  auth_basic "Restricted Access";
  auth_basic_user_file /home/braulio/htpasswd;

  location / {
    # Serve the specific file
    alias /home/braulio/WhatsApp_Export/;

    # Disable directory listing (important for security)
    autoindex on;

  }
}

