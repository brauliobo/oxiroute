# Synthetic authenticated forward proxy with a CONNECT guard.
# Every name and address is invented (documentation ranges only).

http_port 31280
access_log none
dns_nameservers 192.0.2.20 192.0.2.21
acl clients src 192.0.2.0/24
acl clients src 198.51.100.0/24
acl ssl_ports port 31000
acl safe_ports port 80
acl safe_ports port 21
acl safe_ports port 443
acl safe_ports port 70
acl safe_ports port 210
acl safe_ports port 1025-65535
acl safe_ports port 280
acl safe_ports port 488
acl safe_ports port 591
acl safe_ports port 777
http_access deny !safe_ports
http_access deny CONNECT !ssl_ports
http_access allow localhost manager
http_access deny manager
http_access deny to_localhost
http_access deny to_linklocal
http_access allow localhost
auth_param basic program /usr/lib/squid/basic_ncsa_auth /path/to/htpasswd
auth_param basic realm Synthetic proxy
auth_param basic credentialsttl 2 hours
acl authenticated proxy_auth REQUIRED
http_access allow clients authenticated
http_access deny all
coredump_dir /var/spool/squid
forwarded_for delete
via off
refresh_pattern ^ftp: 60 20% 1440
refresh_pattern -i (/cgi-bin/|\?) 0 0% 0
refresh_pattern . 0 20% 4320
