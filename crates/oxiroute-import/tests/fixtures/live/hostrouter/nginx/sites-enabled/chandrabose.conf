server { 
  server_name cloud.prout.io;

  location / { 
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Host $host;
    proxy_pass http://10.0.11.204;
    proxy_buffering off;
    proxy_request_buffering off;

    proxy_cookie_path / "/; SameSite=none; Secure";

    client_max_body_size 16400M;

    ### Set timeouts ###
    proxy_read_timeout 6000s;
    proxy_send_timeout 6000s;
    proxy_connect_timeout 6000s;
  }   

  listen 443 ssl; # managed by Certbot
  listen [::]:443 ssl;
  ssl_certificate /etc/letsencrypt/live/cloud.prout.io/fullchain.pem; # managed by Certbot
  ssl_certificate_key /etc/letsencrypt/live/cloud.prout.io/privkey.pem; # managed by Certbot
  include letsencrypt/options-ssl-nginx.conf; # managed by Certbot
  ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}

