events {}
http {
  access_log off;
  server {
    listen 192.0.2.10:80 default_server;
    server_name _;
    location / { return 404; }
  }
  server {
    listen 192.0.2.10:80;
    server_name a.example.com;
    if ($host = a.example.com) {
      return 301 https://$host$request_uri;
    }
    return 404;
  }
}
