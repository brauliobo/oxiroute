[package]
name = "oxiroute"
description = "Pingora-based HTTP and TCP proxy runtime for OxiRoute"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[lib]
name = "oxiroute_server"

[[bin]]
name = "oxiroute"
path = "src/main.rs"

[dependencies]
aho-corasick.workspace = true
arc-swap.workspace = true
async-trait.workspace = true
base64.workspace = true
bcrypt.workspace = true
bytes.workspace = true
clap.workspace = true
clap_complete.workspace = true
clap_mangen.workspace = true
env_logger.workspace = true
futures-util.workspace = true
h2.workspace = true
h3.workspace = true
h3-quinn.workspace = true
http.workspace = true
httpdate.workspace = true
http-body-util.workspace = true
hyper.workspace = true
hyper-util.workspace = true
hickory-resolver.workspace = true
log.workspace = true
local-ip-address.workspace = true
notify.workspace = true
openssl.workspace = true
oxiroute-acme = { path = "../oxiroute-acme" }
oxiroute-allocator = { path = "../oxiroute-allocator", default-features = false }
oxiroute-aged-executor = { path = "../oxiroute-aged-executor" }
oxiroute-worker-scaling = { path = "../oxiroute-worker-scaling" }
oxiroute-config = { path = "../oxiroute-config" }
oxiroute-cpu = { path = "../oxiroute-cpu", features = ["std"] }
oxiroute-h1-head = { path = "../oxiroute-h1-head" }
oxiroute-epoll-h1 = { path = "../oxiroute-epoll-h1" }
oxiroute-config-source = { path = "../oxiroute-config-source" }
oxiroute-cache = { path = "../oxiroute-cache" }
oxiroute-compress = { path = "../oxiroute-compress" }
oxiroute-import = { path = "../oxiroute-import" }
oxiroute-forward-proxy = { path = "../oxiroute-forward-proxy" }
oxiroute-h3 = { path = "../oxiroute-h3" }
oxiroute-rtmp = { path = "../oxiroute-rtmp" }
oxiroute-supervision = { path = "../oxiroute-supervision" }
oxiroute-tls-rustls = { path = "../oxiroute-tls-rustls" }
parking_lot.workspace = true
pingora.workspace = true
quinn.workspace = true
ratatui.workspace = true
rustix.workspace = true
rustls.workspace = true
rustls-native-certs.workspace = true
schemars = "=1.2.3"
serde.workspace = true
serde_json.workspace = true
signal-hook.workspace = true
thiserror.workspace = true
time.workspace = true
tokio.workspace = true
tokio-openssl.workspace = true
x509-parser.workspace = true
zeroize.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
oxiroute-supervision-unix = { path = "../oxiroute-supervision-unix" }
oxiroute-supervisor-master = { path = "../oxiroute-supervisor-master" }
oxiroute-supervisor-process = { path = "../oxiroute-supervisor-process" }

[dev-dependencies]
brotli = { version = "9.1.1", default-features = false, features = ["std"] }
flate2 = "1.1.11"
rml_rtmp.workspace = true
rustls.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "net", "rt", "sync", "test-util", "time"] }
tokio-rustls.workspace = true
tokio-tungstenite.workspace = true
zstd = { version = "0.14.3", default-features = false }

[features]
default = ["jemalloc"]
jemalloc = ["oxiroute-allocator/jemalloc"]
# jemalloc heap profiling (see crates/oxiroute-allocator); for memory investigations only.
heap-profile = ["jemalloc", "oxiroute-allocator/profiling"]
# The binary counts its allocator calls and writes them on SIGUSR1 to $OXIROUTE_INTERNAL_TEST_ALLOC_FILE (tests, R2 harness).
alloc-count = ["oxiroute-allocator/count"]

[[test]]
name = "tls"
path = "src/tls/tests.rs"

[[bin]]
name = "oxiroute-supervisor-launcher-fixture"
path = "tests/fixtures/supervisor_launcher.rs"
test = false
bench = false

