http {
  client_max_body_size 1m;
  proxy_connect_timeout 30s;
  proxy_read_timeout 30s;
  proxy_send_timeout 30s;
  proxy_http_version 1.1;

  upstream local_application {
    server 127.0.0.1:8080;
  }

  upstream lan_application {
    server application.internal.lan:8080;
  }

  server {
    listen 127.0.0.1:8088 default_server;
    server_name local.example.test;
    location / { proxy_pass http://local_application; }
  }

  server {
    listen [::1]:8089;
    server_name lan.example.test;
    location / { proxy_pass http://lan_application; }
  }
}
