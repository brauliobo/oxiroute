[workspace]
members = [
    "crates/oxiroute-config",
    "crates/oxiroute-rtmp",
    "crates/oxiroute-server",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/oxiroute/oxiroute"
rust-version = "1.87"
version = "0.1.0"

[workspace.dependencies]
async-trait = "0.1"
bytes = "1"
env_logger = "0.11"
futures-util = "0.3"
http = "1"
log = "0.4"
mlua = { version = "0.11", features = ["lua54", "serialize", "vendored"] }
pingora = { version = "0.8.0", features = ["proxy"] }
rml_rtmp = "=0.8.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "sync"] }
tokio-tungstenite = { version = "0.26", default-features = false, features = ["connect"] }
uuid = { version = "1", features = ["v4"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
