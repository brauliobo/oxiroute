events {}
http {
  access_log off;
  proxy_buffering off;
  upstream app { server unix:/run/oxiroute/app.sock; }
  server {
    listen 192.0.2.10:8081;
    server_name .example.org;
    location / { proxy_set_header Host $host; proxy_pass http://app; }
  }
  server {
    listen 192.0.2.10:8082;
    server_name *.example.com;
    location / { proxy_set_header Host $host; proxy_pass http://app; }
  }
  server {
    listen 192.0.2.10:8083;
    server_name _ a.example.com;
    location / { proxy_set_header Host $host; proxy_pass http://app; }
  }
  server {
    listen 192.0.2.10:8084;
    location / { proxy_set_header Host $host; proxy_pass http://app; }
  }
}
